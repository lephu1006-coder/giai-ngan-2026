name: Cập nhật số liệu giải ngân

on:
  schedule:
    - cron: "40 23 * * *"   # 06:40 sáng giờ Việt Nam, hằng ngày
  workflow_dispatch: {}      # cho phép bấm chạy tay trong tab Actions

permissions:
  contents: write

concurrency:
  group: cap-nhat
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"
      - name: Tải số liệu từ Google Sheet
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
        run: python fetch.py
      - name: Dựng trang (dừng nếu số liệu không khớp)
        run: python build.py
      - name: Lưu và đăng
        run: |
          git config user.name "cap-nhat-tu-dong"
          git config user.email "actions@users.noreply.github.com"
          git add tonghop.json index.html
          if git diff --cached --quiet; then echo "Không có thay đổi"; exit 0; fi
          git commit -m "Cập nhật số liệu $(TZ=Asia/Ho_Chi_Minh date +%d/%m/%Y)"
          git push
